<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Churn-Spark demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #17120b;
        color: #fffdf9;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(1100px, 100%);
      }

      h1 {
        margin: 0 0 16px;
      }

      video {
        display: block;
        width: 100%;
        border-radius: 12px;
        background: #000;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      }

      a {
        color: #9eb5ff;
      }

      p {
        color: #d7cdbd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Churn-Spark demo</h1>
      <video controls preload="metadata">
        <source src="churn-spark-demo.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
      <p><a href="churn-spark-demo.mp4">Download the MP4</a></p>
    </main>
  </body>
</html>
